name: PyPI wheels

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  test-hpp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[hpp,dev]" pytest-timeout
      - name: Record resolved wheel versions
        run: python -m pip freeze | tee wheel-versions.txt
      - run: timeout --kill-after=30s 20m python -m pytest tests -m "not slow_planning" --timeout=300 --timeout-method=thread --junitxml=test-results.xml
      - name: Load example scenes
        run: |
          timeout 120s python script/screw_assembly/task_screw_assembly.py --check
          timeout 120s python script/ikea_table_prototype/task_assemble_table.py --show-joints
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpp-test-results
          path: |
            test-results.xml
            wheel-versions.txt

  nightly-twin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test: [test_grasp_release_use_case_twin, test_twin_regrasp_bt_session]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[hpp,dev]" pytest-timeout
      - name: Run the slow scene check in its own process
        run: >-
          timeout --kill-after=30s 6m python -m pytest
          tests/${{ matrix.test }}.py -m slow_planning
          --timeout=300 --timeout-method=thread --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test }}
          path: test-results.xml

  nightly-mission:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[hpp]"
      - name: Plan a one-part mission
        working-directory: script/screw_assembly
        run: |
          python build_scene.py --parts 1
          timeout 20m python -u task_screw_assembly.py --seed 1 --run-dir runs/nightly --no-viewer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-mission
          path: script/screw_assembly/runs/nightly/

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build twine trove-classifiers
      - name: Reject classifiers PyPI would refuse at upload
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from trove_classifiers import classifiers
          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["classifiers"]
          bad = [c for c in declared if c not in classifiers]
          assert not bad, f"Invalid classifiers: {bad}"
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv /tmp/long-tamp-wheel
          /tmp/long-tamp-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/long-tamp-wheel/bin/python -c "import long_tamp; print(long_tamp.get_available_backends())"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
