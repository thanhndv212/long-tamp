name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  # Dry run: build, then hand the artifact to a job that downloads and checks
  # it the way publish would. Publishing only ever runs for a pushed tag. Runs
  # on every PR that changes this file (e.g. action bumps), and on demand once
  # this trigger is on the default branch.
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a commit already on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check that the tag matches the package version
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag/version mismatch"
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the built wheel in a clean environment
        run: |
          python -m venv /tmp/long-tamp-release
          /tmp/long-tamp-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/long-tamp-release/bin/python -c "import long_tamp; print(long_tamp.get_available_backends())"
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/

  verify-artifact:
    # Dry run only: the same artifact handoff publish relies on.
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - run: ls -l dist/
      - run: python3 -m pip install twine && python3 -m twine check dist/*

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/long-tamp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      # Uses the PYPI_API_TOKEN environment secret when set; with it unset the
      # action falls back to trusted publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
