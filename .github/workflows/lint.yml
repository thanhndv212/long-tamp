name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install ruff black
      # Enforcing: real errors (pyflakes F-codes: undefined/unused names, etc.) and
      # formatting. These are kept clean in the tree, so a failure here is a genuine
      # regression and blocks the workflow.
      - run: ruff check --select F src
      - run: black --check src

  lint-style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install ruff
      # Advisory: the full ruff style set still carries debt (RUF012 mutable class
      # defaults, RUF013 implicit-optional, ambiguous unicode, …). Reported, not blocking.
      # Burn it down, then fold rules into the enforcing `lint` job.
      - run: ruff check src
        continue-on-error: true

  test-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Verify the base install independently of the native HPP extra.
      - run: pip install --upgrade pip && pip install -e ".[dev,planning,sim]" pytest-timeout
      - run: python -c "import long_tamp; print(long_tamp.get_available_backends())"
      - run: python -m pytest tests/ -q --timeout=300 --timeout-method=thread
      - run: python script/validate_standalone_install.py

  behaviortree:
    # The C++ side of the BehaviorTree.CPP path: the node library, the plugin, the
    # host, and the CTests that need no HPP scene (fake session, fault paths, plugin
    # loading, event-stream parity with the Python runner). examples/behaviortree is
    # configured on its own (no HPP C++ packages), against the released
    # BehaviorTree.CPP from the ROS 2 apt repository. Building it from source is turned
    # off, so a missing package fails here. The runner is pinned to 24.04 because ROS 2
    # Jazzy packages target it (ubuntu-latest moves to Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROS_DISTRO: jazzy
    steps:
      - uses: actions/checkout@v7
      - name: Install BehaviorTree.CPP (ROS 2 apt package)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ros-infrastructure/ros-apt-source/releases/latest -q .tag_name)
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsSL -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${tag}/ros2-apt-source_${tag}.${codename}_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "ros-${ROS_DISTRO}-behaviortree-cpp"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The embedded Python imports long_tamp (base install: no HPP needed).
      - run: python -m pip install -e .
      - name: Configure
        # behaviortree_cpp's CMake config pulls in ament_cmake, which imports
        # ament_package from Python3_EXECUTABLE: give setup-python's 3.12 (same minor
        # as Jazzy's) the ROS site-packages.
        env:
          PYTHONPATH: /opt/ros/${{ env.ROS_DISTRO }}/lib/python3.12/site-packages
        run: >-
          cmake -S examples/behaviortree -B build-bt -DBUILD_TESTING=ON
          -DLONG_TAMP_FETCH_BEHAVIORTREE_CPP=OFF
          -DCMAKE_PREFIX_PATH="/opt/ros/${ROS_DISTRO}"
          -DPython3_EXECUTABLE="$(which python)"
      - run: cmake --build build-bt --parallel
      - name: Test
        run: |
          export LD_LIBRARY_PATH="/opt/ros/${ROS_DISTRO}/lib:${LD_LIBRARY_PATH}"
          ctest --test-dir build-bt -R taskplan_bt --output-on-failure --timeout 300

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install "mkdocs>=1.6" "mkdocs-material>=9.5" "mkdocs-include-markdown-plugin>=7.0"
      # Strict: a broken link or a page missing from mkdocs.yml's nav fails the PR
      # (see `validation:` in mkdocs.yml).
      - run: mkdocs build --strict

  changelog:
    # A PR that changes the library or the examples carries a CHANGELOG.md entry,
    # unless it is labelled `skip-changelog` (refactors, tests, CI, docs-only).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          if [ "$SKIP" = "true" ]; then echo "skip-changelog label set"; exit 0; fi
          if ! echo "$changed" | grep -qE '^(src|script)/'; then
            echo "no library/example change"; exit 0
          fi
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then exit 0; fi
          echo "::error::src/ or script/ changed without a CHANGELOG.md entry. Add one under [Unreleased], or label the PR skip-changelog."
          exit 1
