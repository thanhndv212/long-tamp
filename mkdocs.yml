site_name: long_tamp
site_description: Long-horizon, multi-arm task-and-motion planning (TAMP) for manipulation, built on HPP.
repo_url: https://github.com/thanhndv212/long-tamp
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

# `mkdocs build --strict` (CI `docs` job) fails on these, so a page missing from
# `nav` or a broken link is caught in the PR that introduces it.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: info
  anchors: info

plugins:
  - search
  - include-markdown

nav:
  - Home: index.md
  - Installation: INSTALL.md
  - Architecture: architecture.md
  - Usage:
      - Overview: usage/README.md
      - Standalone usage: usage/standalone-usage.md
      - BehaviorTree.CPP integration: usage/behaviortree-integration.md
      - Refiner: usage/refiner.md
      - Automatic task planning: usage/task-planning-pddl.md
      - AI models: usage/ai-models.md
      - Execution backends: usage/execution.md
      - Simulation (MuJoCo): usage/simulation-mujoco.md
      - Skills: usage/skills.md
      - Mission events: usage/events.md
  - Features:
      - Overview: features/README.md
      - Phase-target lookahead: features/phase-target-lookahead.md
      - Transit edge robustness: features/transit-edge-robustness.md
      - Logging verbosity: features/logging-verbosity.md
  - Development:
      - Workflow: development/workflow.md
      - Validation (screw assembly): development/validation.md
      - Architecture decisions:
          - adr/README.md
          - "0001 Planner / refiner / executor": adr/0001-planner-refiner-executor.md
          - "0002 Effects as runtime guards": adr/0002-effects-as-runtime-guards.md
          - "0003 Screw assembly reference track": adr/0003-screw-assembly-reference-track.md
          - "0004 Execution contract": adr/0004-execution-contract.md
          - "0005 Partial-order plans": adr/0005-partial-order-plans.md
          - "0006 AI model integration": adr/0006-ai-model-integration.md
  - Plans:
      - Roadmap: plans/roadmap.md
      - "Roadmap: PyPI as the default install": plans/pypi-install-roadmap.md
      - "0.1.0 release draft": plans/release-0.1.0.md
  - Bugs (upstream HPP):
      - Constraint-graph factory combinatorial blowup: bugs/constraint-graph-factory-combinatorial-blowup.md
      - hpp-core unbounded planning loops: bugs/hpp-core-unbounded-planning-loops.md
      - hpp-manipulation leaf projection bug: bugs/hpp-manipulation-leaf-projection-bug.md
      - pyhpp factory locked-joint bugs: bugs/pyhpp-factory-locked-joint-bugs.md
  - HPP Python interface:
      - pyhpp API documentation: hpp_python_interface/pyhpp_api_documentation.md
      - Path planners comparison: hpp_python_interface/path-planners-comparison.md
      - hpp-manipulation complete motion plan: hpp_python_interface/hpp_manipulation_complete_motion_plan.md
  - Legacy (CORBA backend and SpaceLab example, removed):
      - CORBA API documentation: legacy/hpp_python_interface/corba_api_documentation.md
      - CORBA vs pyhpp comparison: legacy/hpp_python_interface/comparison_corba_vs_pyhpp.md
      - Motion quality / time parameterization: legacy/bugs/motion-quality-time-parameterization.md
      - Refactor codebase: legacy/plans/refactor-codebase.md
      - DBT / ROS 2 integration: legacy/usage/dbt-integration.md
      - Development report: legacy/report/development-report.md
  - Development report:
      - Overview: report/README.md
