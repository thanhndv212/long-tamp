# CI for agimus_spacelab.
#
# NOTE: the test suite (tests/) cannot run on a plain Python runner — it imports
# pinocchio / pyhpp, which are HPP native bindings not available on PyPI. A real
# test job needs the hpp-agimus image (source-built HPP); add it here once that
# image is published to a registry the runner can reach:
#
#   test:
#     stage: test
#     image: <registry>/hpp-agimus:<tag>
#     script:
#       - pip install --no-deps -e .
#       - python -m pytest tests/ -v
#
# For now CI does lint only, which runs anywhere.

stages:
  - lint

.lint_base:
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff black
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Enforcing: real errors (pyflakes F-codes: undefined/unused names, etc.) and
# formatting. These are kept clean in the tree, so a failure here is a genuine
# regression and blocks the pipeline.
lint:
  extends: .lint_base
  stage: lint
  script:
    - ruff check --select F src
    - black --check src

# Advisory: the full ruff style set still carries debt (RUF012 mutable class
# defaults, RUF013 implicit-optional, ambiguous unicode, …). Reported in the MR
# without blocking. Burn it down, then fold rules into the enforcing `lint` job.
lint-style:
  extends: .lint_base
  stage: lint
  script:
    - ruff check src
  allow_failure: true
