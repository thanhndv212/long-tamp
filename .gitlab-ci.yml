# CI for agimus_spacelab.
#
# NOTE: the test suite (tests/) cannot run on a plain Python runner — it imports
# pinocchio / pyhpp, which are HPP native bindings not available on PyPI. A real
# test job needs the hpp-agimus image (source-built HPP); add it here once that
# image is published to a registry the runner can reach:
#
#   test:
#     stage: test
#     image: <registry>/hpp-agimus:<tag>
#     script:
#       - pip install --no-deps -e .
#       - python -m pytest tests/ -v
#
# For now CI does lint only, which runs anywhere.

stages:
  - lint

# Style/lint sweep. The codebase currently carries lint + formatting debt, so
# this job is ADVISORY (allow_failure) — it reports issues in the MR without
# blocking. Burn the debt down with `ruff check --fix src` and `black src`,
# then remove `allow_failure` to make it enforcing.
lint:
  stage: lint
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff black
  script:
    - ruff check src
    - black --check src
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
