[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agimus-spacelab"
version = "0.1.0"
description = "Agimus Spacelab - Manipulation Planning Framework"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "LGPL-3.0"}
authors = [
    {name = "Thanh Nguyen", email = "dvtnguyen@laas.fr"}
]
maintainers = [
    {name = "Thanh Nguyen", email = "dvtnguyen@laas.fr"}
]
keywords = ["robotics", "manipulation", "motion-planning", "hpp", "agimus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Robotics",
]

# Hard runtime deps.
#   numpy / pyyaml — imported unguarded in core modules (numpy, yaml_loader,
#                    utils/transforms).
#   viser / trimesh / pycollada — the browser viewer (pyhpp_viser) is the
#                    default viewer, so its PyPI-side deps ship by default. The
#                    pyhpp_viser bindings themselves come from hpp-gepetto-viewer
#                    (robotpkg/conda, not PyPI).
# pinocchio is intentionally NOT a hard dep: in every supported environment it
# is provided by the HPP stack (robotpkg /opt/openrobots, built against NumPy
# 1.x). Pulling `pin` from PyPI here dragged in NumPy 2.x and segfaulted the
# native pinocchio. Standalone-without-HPP users get it via the [standalone]
# extra (which pins compatible numpy).
dependencies = [
    # numpy capped <2: the HPP/pinocchio native bindings (robotpkg, /opt/openrobots)
    # are compiled against NumPy 1.x. A NumPy 2.x in the user/site path shadows the
    # system numpy and segfaults the pinocchio C-extension (ABI mismatch).
    "numpy>=1.19.0,<2",
    "pyyaml>=5.1",
    "viser",
    "trimesh",
    "pycollada",
]

[project.optional-dependencies]
# Standalone (no HPP stack present): pull pinocchio from PyPI. Only use this in
# an environment WITHOUT robotpkg/system pinocchio — mixing the two causes the
# NumPy-ABI segfault described above.
standalone = ["pin>=2.6,<3", "numpy>=1.19.0,<2"]

# --- Optional native HPP stacks (NOT on PyPI; robotpkg / conda-forge only) ---
# These extras carry no PyPI packages; they exist as valid, documented install
# targets and as a place to record what the system-package prerequisites are.

# TOPPRA time-parameterization (optional optimizer). The pyhpp_toppra binding
# ships in `hpp-toppra`, which requires the `toppra` C++ lib (>=0.6.2).
toppra = [
    # System packages only: hpp-toppra, toppra.
]

# CORBA backend — DEPRECATED, scheduled for removal. Prefer the default pyhpp
# backend. Native-only prerequisites: hpp-manipulation-corba, hpp-corbaserver,
# hpp-gepetto-viewer, omniORBpy. Install via robotpkg / conda-forge.
corba = [
    # System packages only.
]

dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "ruff",
    "sphinx",
    "sphinx-rtd-theme",
]

# MkDocs site over docs/ — `mkdocs serve` / `mkdocs build` (see mkdocs.yml).
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-include-markdown-plugin>=7.0",
]

all = [
    "agimus-spacelab[dev,docs]",
]

[project.urls]
Homepage = "https://gitlab.laas.fr/agimus-project/agimus_spacelab"
Documentation = "https://agimus-spacelab.readthedocs.io"
Repository = "https://gitlab.laas.fr/agimus-project/agimus_spacelab"
Issues = "https://gitlab.laas.fr/agimus-project/agimus_spacelab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agimus_spacelab = ["py.typed"]

[tool.ruff]
extend-exclude = ["cmake"]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "NPY", "RUF", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=agimus_spacelab --cov-report=html --cov-report=term"

[tool.black]
line-length = 88
target-version = ['py38']
extend-exclude = '''
/(
  | cmake
)/
'''
